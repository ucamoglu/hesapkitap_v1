buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

def assignNamespaceFromManifest = { subproject ->
    def androidExtension = subproject.extensions.findByName("android")
    if (androidExtension == null || androidExtension.namespace != null) {
        return
    }

    def manifestFile = androidExtension.sourceSets.main.manifest.srcFile
    if (manifestFile?.exists()) {
        def manifestText = manifestFile.getText('UTF-8')
        def packageMatcher = manifestText =~ /package="([^"]+)"/
        if (packageMatcher.find()) {
            androidExtension.namespace = packageMatcher.group(1)
        }
    }
}

subprojects { subproject ->
    if (subproject.state.executed) {
        assignNamespaceFromManifest(subproject)
    } else {
        subproject.afterEvaluate {
            assignNamespaceFromManifest(subproject)
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
